name: XBZ - Catalogo publico e consulta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Consultar catalogo
        run: node scripts/xbz-public-first.mjs
        env:
          XBZ_USER: ${{ secrets.XBZ_USER }}
          XBZ_PASSWORD: ${{ secrets.XBZ_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbz-public-first
          path: artifacts/xbz-*.json
          retention-days: 2
